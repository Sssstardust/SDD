name: SDD Python and Java CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov ruff pyyaml

    - name: Run Ruff Linter
      run: |
        ruff check sdd_core/ tests/

    - name: Run Python unit tests with coverage
      run: |
        pytest tests/ --cov=sdd_core --cov-report=xml --cov-fail-under=60

    - name: Run Java tests with Maven
      run: |
        mvn test
