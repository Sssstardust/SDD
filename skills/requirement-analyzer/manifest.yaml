name: requirement-analyzer
display_name: 需求分析器
version: "1.0.0"
description: "将自然语言 PRD 解析为结构化 JSON (structured-prd.json)，并提取关键架构事实。"
input_schema: "input.schema.json"
output_schema: "output.schema.json"
default_prompt_template: "使用 $requirement-analyzer 把这份 PRD 转成 structured-prd.json，并显式列出歧义和待澄清项。"
supported_platforms: ["openai", "claude", "gemini"]
