[project]
name = "sdd"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.ruff.lint]
ignore = ["E402", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"attached_project.py" = ["F401"]
"pipeline_facade.py" = ["F401"]
"adapters.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
cache_dir = ".cache/pytest"
norecursedirs = [
  ".cache",
  ".git",
  ".idea",
  ".pytest_cache",
  ".tmp_doctor_smoke",
  ".tmp_test_workspace",
  ".venv",
  "pytest-cache-files-*",
]
