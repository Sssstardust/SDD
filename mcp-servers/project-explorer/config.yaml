{
  "scan_roots": [
    "src/main/java",
    "src/test/java"
  ],
  "language": "java",
  "language_profiles": {
    "java": {
      "scan_roots": ["src/main/java", "src/test/java"],
      "source_extensions": [".java"]
    },
    "python": {
      "scan_roots": ["src", "."],
      "source_extensions": [".py"]
    },
    "typescript": {
      "scan_roots": ["src"],
      "source_extensions": [".ts", ".tsx"]
    },
    "javascript": {
      "scan_roots": ["src"],
      "source_extensions": [".js", ".jsx", ".mjs", ".cjs"]
    },
    "go": {
      "scan_roots": ["."],
      "source_extensions": [".go"]
    }
  },
  "design_roots": [
    "specs"
  ],
  "module_prefix_map": {},
  "duplicate_strategy": "disambiguate",
  "context_budget": {
    "classes": 60,
    "columns": 80,
    "rules_chars": 8000
  },
  "cache": {
    "enabled": true,
    "path": ".cache/project-explorer-snapshot.json",
    "ttl_minutes": 30
  },
  "skip_words": [
    "GET",
    "POST",
    "PUT",
    "DELETE",
    "HTTP",
    "API",
    "URL",
    "JSON",
    "SQL",
    "DDL",
    "SDD",
    "PRD",
    "MCP",
    "CI",
    "PR",
    "OK"
  ]
}
